version: 2
updates:
  # Rust 依赖（workspace 统一管理，Cargo.lock 受版本控制）
  - package-ecosystem: cargo
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: "Asia/Shanghai"
    open-pull-requests-limit: 5
    labels: ["dependencies", "rust"]
    commit-message:
      prefix: "chore(deps)"
    groups:
      # 小版本/补丁合并成一个 PR，减少评审噪声；大版本单独开 PR 便于评估破坏性变更。
      cargo-minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  # GitHub Actions 版本升级（保障 CI 供应链安全）
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: "Asia/Shanghai"
    open-pull-requests-limit: 5
    labels: ["dependencies", "ci"]
    commit-message:
      prefix: "chore(ci)"
