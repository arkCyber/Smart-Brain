name: Release

# 打 tag（v0.1.0 形式）时构建各平台可执行文件并发布 GitHub Release。
# 也可在 Actions 页面手动触发（workflow_dispatch）做冒烟构建。
on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-binaries:
    name: build / ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: macos-14
            target: aarch64-apple-darwin
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Build release binaries
        run: cargo build --locked --release -p brain-node

      - name: Package artifact
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME:-manual}"
          NAME="smart-brain-${VERSION}-${{ matrix.target }}"
          mkdir -p "dist/${NAME}"
          cp target/release/brain-node "dist/${NAME}/"
          cp README.md LICENSE NOTICE CHANGELOG.md config.example.json "dist/${NAME}/"
          tar -C dist -czf "dist/${NAME}.tar.gz" "${NAME}"
          # 校验和文件只写“文件基名”，与压缩包同级，
          # 这样下载两者后可直接 `shasum -a 256 -c <name>.tar.gz.sha256` 校验。
          ( cd dist && { shasum -a 256 "${NAME}.tar.gz" || sha256sum "${NAME}.tar.gz"; } > "${NAME}.tar.gz.sha256" )
          ls -lh "dist/${NAME}.tar.gz"
          cat "dist/${NAME}.tar.gz.sha256"

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: smart-brain-${{ matrix.target }}
          path: dist/*.tar.gz*

  # 单独一个 job 发布：避免多个矩阵任务并发创建同一个 Release
  # （否则发布说明会被重复追加）。仅在 tag 触发时执行。
  publish:
    name: publish GitHub Release
    needs: build-binaries
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v7
        with:
          path: artifacts
          merge-multiple: true

      - name: Publish release
        uses: softprops/action-gh-release@v3
        with:
          files: artifacts/*.tar.gz*
          generate_release_notes: true
          draft: false
