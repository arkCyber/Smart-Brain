name: Security audit

# 供应链安全：依赖漏洞扫描（RustSec 数据库）。
# 与 CI 分离，避免在每次 push 上阻塞开发；每周一固定扫描，并在依赖清单变更时触发。
on:
  push:
    branches: [ main ]
    paths:
      - "**/Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/audit.yml"
  pull_request:
    paths:
      - "**/Cargo.toml"
      - "Cargo.lock"
  schedule:
    - cron: "0 22 * * 0" # 每周一 06:00 (Asia/Shanghai)

permissions:
  contents: read

jobs:
  audit:
    name: cargo audit (RustSec)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v7

      # 使用预编译的 cargo-audit（比 cargo install 快得多）。
      - name: Install cargo-audit
        uses: taiki-e/install-action@cargo-audit

      # 审计结果同时写入 job summary：即使不下载日志，也能在 Checks 页面
      # 直接看到是哪些依赖命中了哪条安全公告（附 RustSec 链接与修复建议）。
      - name: Run cargo audit
        shell: bash
        run: |
          set +e
          cargo audit > /tmp/audit.log 2>&1
          status=$?
          cat /tmp/audit.log
          if [ $status -ne 0 ]; then
            {
              echo "### 🔐 RustSec 审计未通过"
              echo ""
              echo '```text'
              tail -c 6000 /tmp/audit.log
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi
          exit $status
