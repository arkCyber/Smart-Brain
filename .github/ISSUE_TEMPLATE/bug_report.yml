name: 🐛 Bug 报告
description: 报告一个可复现的问题（构建失败、测试失败、演示输出异常、崩溃等）
title: "[Bug] "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        感谢反馈！提交前请先搜索 [已有 Issue](https://github.com/arkCyber/Smart-Brain/issues)，
        并确认你已阅读 [SUPPORT.md](https://github.com/arkCyber/Smart-Brain/blob/main/SUPPORT.md)。
        **安全问题请勿使用本模板**，请按 [SECURITY.md](https://github.com/arkCyber/Smart-Brain/blob/main/SECURITY.md) 私下报告。
  - type: checkboxes
    id: preflight
    attributes:
      label: 提交前检查
      options:
        - label: 我已搜索过现有 Issue，确认这不是重复问题
          required: true
        - label: 我使用仓库锁定的工具链（rust-toolchain.toml）复现过该问题
          required: true
        - label: 我已确认这**不是**安全漏洞（安全漏洞走 SECURITY.md 私下报告）
          required: true
  - type: textarea
    id: what-happened
    attributes:
      label: 问题描述
      description: 清楚简洁地描述实际发生了什么，以及你期望发生什么。
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: 复现步骤
      description: |
        请给出最小复现。优先使用单 crate 示例（`cargo run -p <crate> --example <name>`）
        或 `cargo run -p brain-node -- --demo <name>`，而不是整机流程。
      placeholder: |
        1. cargo run -p brain-node -- --demo autopilot
        2. 观察输出 …
      render: bash
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 期望行为
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: 完整日志 / 报错输出
      description: 请粘贴完整输出（含编译错误、panic 回溯）。过长可折叠或附文件。
      render: shell
    validations:
      required: false
  - type: textarea
    id: config
    attributes:
      label: 相关配置（已脱敏）
      description: 如与配置有关，请贴出 `config.json` 的相关片段，**务必删除 api_token 等密钥**。
      render: json
    validations:
      required: false
  - type: dropdown
    id: area
    attributes:
      label: 受影响的模块
      multiple: true
      options:
        - brain-core（错误/配置/时钟/数学）
        - brain-message / brain-middleware / brain-transport（通信与总线）
        - brain-state / brain-behavior-tree（状态机与决策）
        - brain-perception / brain-odometry / brain-mapping（感知与建图）
        - brain-planning / brain-nav / brain-autopilot（规划与自主导航）
        - brain-robot / brain-kinematics / brain-locomotion（具身与运动控制）
        - brain-agent（LLM / Agent 层）
        - brain-zenoh / brain-ipc / brain-sim（通信 / IPC / 仿真）
        - brain-node（CLI 与演示）
        - 构建 / CI / 文档
        - 不确定
  - type: dropdown
    id: features
    attributes:
      label: 启用的 Cargo feature
      multiple: true
      options:
        - 默认（无 feature）
        - serial
        - can
        - onnx
        - http-llm
        - ollama
        - hermes
        - real-zenoh
        - async
        - 其他 / 不确定
  - type: input
    id: version
    attributes:
      label: 版本 / 提交
      description: 输出 `git rev-parse --short HEAD` 或填写 release 标签
      placeholder: "例如 d199722 或 v0.1.0"
    validations:
      required: true
  - type: input
    id: rust-version
    attributes:
      label: Rust 版本
      description: 输出 `rustc --version`
      placeholder: "例如 rustc 1.98.0 (88d9e12ae 2026-08-18)"
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: 操作系统 / 硬件平台
      placeholder: "例如 Ubuntu 22.04 x86_64 / macOS 15 arm64 / Jetson Orin"
    validations:
      required: true
