[package]
name = "brain-node"
description = "Smart-Brain main executable: assembles and drives all modules"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
brain-core.workspace = true
brain-message.workspace = true
brain-middleware.workspace = true
brain-transport.workspace = true
brain-state.workspace = true
brain-perception.workspace = true
brain-behavior-tree.workspace = true
brain-mission.workspace = true
brain-robot.workspace = true
brain-kinematics.workspace = true
brain-ipc.workspace = true
brain-mapping.workspace = true
brain-odometry.workspace = true
brain-planning.workspace = true
brain-nav.workspace = true
brain-zenoh.workspace = true
brain-autopilot.workspace = true
brain-agent.workspace = true
brain-locomotion.workspace = true
brain-sim.workspace = true
log.workspace = true
env_logger.workspace = true
serde_json.workspace = true

# 可选：tokio 异步运行时（感知/决策作为 async 任务并发）。默认关闭保持构建轻量。
[features]
default = []
async = ["dep:tokio"]

[dependencies.tokio]
version = "1"
optional = true
features = ["rt-multi-thread", "time", "sync", "macros"]
