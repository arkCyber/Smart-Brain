[package]
name = "brain-transport"
description = "Smart-Brain hardware transport: serial/CAN/UDP link to the FCU"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "README.md"
keywords.workspace = true
categories.workspace = true

[dependencies]
brain-core.workspace = true
brain-message.workspace = true
brain-zenoh.workspace = true
log.workspace = true
serde_json.workspace = true

# 可选：真实串口后端（Jetson / RK3588 上启用）
[features]
serial = ["dep:serialport"]
# SocketCAN 仅支持 Linux；`can` feature 在非 Linux 平台编译时给出明确错误。
can = ["dep:socketcan"]

[dependencies.serialport]
version = "4.6"
optional = true

# socketcan 仅用于 Linux（Jetson/RK3588/车规网关）；非 Linux 不拉取该依赖。
[target.'cfg(target_os = "linux")'.dependencies]
socketcan = { version = "3.5", optional = true }
